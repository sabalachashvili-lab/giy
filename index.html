<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Task Manager — Change 1</h1>
    <p>Organize your daily work</p>
  </header>

  <main>
    <section class="tasks">
      <h2>My Tasks</h2>
      <ul class="task-list">
        <li>Learn Git basics</li>
        <li>Create a GitHub repository</li>
        <li>Practice branching</li>
      </ul>
    </section>

    <section class="completed-tasks">
      <h2>Completed Tasks</h2>
      <ul class="completed-list">
        <li><span class="done">?</span> Set up a local Git repo</li>
        <li><span class="done">?</span> Make the first commit</li>
        <li><span class="done">?</span> Push to GitHub</li>
      </ul>
    </section>
  </main>
</body>
</html>
